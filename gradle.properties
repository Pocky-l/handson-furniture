org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.253
# The plain Minecraft the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
neo_form_version=1.21.1-20240808.144430
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players.
fabric_loader_version=0.19.5
fabric_loader_min_version=0.16.1
fabric_api_version=0.116.17+1.21.1
fabric_api_min_version=0.102.0
diegesis_version=1.0.0-beta.11
diegesis_version_range=[1.0.0-beta.11,)
# MrCrayfish's Furniture Mod: Refurbished, whose furniture becomes the stations (CurseForge file ids): Refurbished 1.0.22
# for NeoForge 1.21.1 (compiled against, run by the game tests) with its library Framework 0.13.11, and both for Fabric
# 1.21.1 (the Fabric game tests run them).
refurbished_furniture_min_version=1.0.22
refurbished_furniture_file=7473565
refurbished_furniture_fabric_file=7473562
framework_file=7530361
framework_fabric_file=7530359

## Mod
mod_id=handson_furniture
mod_name=Hands-On Furniture
mod_version=1.0.0
mod_group_id=com.pockyl.handson_furniture
mod_license=MIT
mod_authors=Pocky
mod_description=Open MrCrayfish's furniture with your hands: put things on its shelves anywhere, turned and sized as you like.
mod_url=https://github.com/Pocky-l/handson-furniture

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1809763
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs; curseforge_requires_<loader> replaces the list for that loader.
curseforge_requires=refurbished-furniture,diegesis
curseforge_requires_fabric=refurbished-furniture,diegesis,fabric-api
curseforge_optional=
