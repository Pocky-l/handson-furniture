// The stations, scenes and assets, compiled against plain Minecraft, the Diegesis API and Refurbished. Nothing here may use
// a loader API: that goes through the loader projects.
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
}

dependencies {
    compileOnly "com.pockyl.diegesis:common:${diegesis_version}"
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // The Forge build stands for both: the classes the mixins touch are the same in its Fabric build.
    modCompileOnly "curse.maven:refurbished-furniture-897116:${refurbished_furniture_file}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
